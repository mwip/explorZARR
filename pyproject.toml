[project]
name = "explorzarr"
version = "0.0.1-pre"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "psutil>=7.2.1",
    "textual>=6.11.0",
    "zarr[remote]>=3.1.5",
]

[dependency-groups]
dev = ["ruff>=0.14.10", "ty>=0.0.8"]
tests = [
    "coverage>=7.13.1",
    "pytest>=9.0.2",
]

[tool.setuptools]
py-modules = ["explorzarr"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "INP001", "S101"]

[tool.ruff.format]
docstring-code-format = true
